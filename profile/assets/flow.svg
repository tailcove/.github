<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="How Tailcove works: your apps send logs, Tailcove buffers and stores them, and you get search, issues, alerts and uptime">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="0.5" stop-color="#5EEAD4" stop-opacity="0.15"/><stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.2"/><stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="wire2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3"><circle cx="3" cy="3" r="2.5" fill="#2DD4BF"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="199" rx="16" fill="#0A0A0A" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <!-- Sources -->
    <text x="60" y="48" font-size="11" font-weight="600" letter-spacing="1.2" fill="#6B7472">YOUR APPS</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#D4D4D0">
      <rect x="60" y="62" width="200" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/><text x="72" y="79" textLength="160" lengthAdjust="spacingAndGlyphs">Laravel · Node · Python</text>
      <rect x="60" y="94" width="200" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/><text x="72" y="111">Browser / JS</text>
      <rect x="60" y="126" width="200" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/><text x="72" y="143" textLength="178" lengthAdjust="spacingAndGlyphs">Vector · Fluent Bit · syslog</text>
    </g>

    <!-- wires in -->
    <path d="M260 75 C330 75 330 100 400 100" fill="none" stroke="url(#wire)" stroke-width="1.5"/>
    <path d="M260 107 C330 107 330 100 400 100" fill="none" stroke="url(#wire)" stroke-width="1.5"/>
    <path d="M260 139 C330 139 330 100 400 100" fill="none" stroke="url(#wire)" stroke-width="1.5"/>
    <text x="330" y="66" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5EEAD4" textLength="104" lengthAdjust="spacingAndGlyphs">POST /api/v1/logs</text>

    <!-- Core -->
    <rect x="399" y="39" width="402" height="122" rx="13" fill="url(#ring)"/>
    <rect x="400" y="40" width="400" height="120" rx="12" fill="#0F1413"/>
    <rect x="420" y="60" width="48" height="48" rx="10" fill="#A6E3D2"/>
    <g fill="#0A0A0A" transform="translate(420 60)">
      <rect x="10" y="12" width="28" height="7" rx="2"/><rect x="20.5" y="19" width="7" height="21" rx="2"/>
      <rect x="10" y="29" width="7" height="11" rx="2"/><rect x="31" y="29" width="7" height="11" rx="2"/>
    </g>
    <text x="484" y="80" font-size="18" font-weight="700" letter-spacing="-0.4" fill="#EDEDEC">Tailcove</text>
    <text x="484" y="100" font-size="12.5" fill="#9A9A96" textLength="166" lengthAdjust="spacingAndGlyphs">Never slows down your app</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7C8785">
      <text x="420" y="138" textLength="360" lengthAdjust="spacingAndGlyphs">never drops a line · backend + frontend errors in one issue</text>
    </g>

    <!-- wires out -->
    <path d="M800 100 C870 100 870 62 940 62" fill="none" stroke="url(#wire2)" stroke-width="1.5"/>
    <path d="M800 100 C870 100 870 90 940 90" fill="none" stroke="url(#wire2)" stroke-width="1.5"/>
    <path d="M800 100 C870 100 870 118 940 118" fill="none" stroke="url(#wire2)" stroke-width="1.5"/>
    <path d="M800 100 C870 100 870 146 940 146" fill="none" stroke="url(#wire2)" stroke-width="1.5"/>

    <!-- Outputs -->
    <text x="940" y="48" font-size="11" font-weight="600" letter-spacing="1.2" fill="#6B7472">YOU GET</text>
    <g font-size="13" fill="#EDEDEC">
      <circle cx="946" cy="62" r="3" fill="#5EEAD4"/><text x="958" y="66" textLength="118" lengthAdjust="spacingAndGlyphs">Search &amp; live tail</text>
      <circle cx="946" cy="90" r="3" fill="#FB7185"/><text x="958" y="94" textLength="176" lengthAdjust="spacingAndGlyphs">Issues (grouped exceptions)</text>
      <circle cx="946" cy="118" r="3" fill="#FBBF24"/><text x="958" y="122" textLength="182" lengthAdjust="spacingAndGlyphs">Alerts → email, Slack, webhook</text>
      <circle cx="946" cy="146" r="3" fill="#818CF8"/><text x="958" y="150" textLength="182" lengthAdjust="spacingAndGlyphs">Uptime monitors &amp; status pages</text>
    </g>
  </g>
</svg>
