<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="556" viewBox="0 0 1200 556" role="img" aria-label="Tailcove — log management for developers who ship fast">
  <defs>
    <radialGradient id="g1" cx="0.18" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.85" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#5EEAD4" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#0F766E"/>
