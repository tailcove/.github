<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="376" viewBox="0 0 1200 376" role="img" aria-label="Catches real errors: Opt in to uncaught errors, unhandled rejections and console.error, next to your backend logs.; Reliable on page close: Flushes with sendBeacon when a tab is hidden or closed, so the last log isn&#x27;t lost.; Safe: A failed delivery is caught and dropped. Logging will never break your page.; Any framework: React, Vue, Svelte and Next.js helpers, or a plain script tag.; One shared issue: A browser error groups with the matching server error, because both use the same shape.; Public by design: A browser key is meant to ship in your front-end. Allowed origins control access.">
