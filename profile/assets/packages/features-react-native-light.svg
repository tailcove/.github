<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="376" viewBox="0 0 1200 376" role="img" aria-label="Works in Expo: Plain JavaScript, no native module: Expo managed and bare, and React Native 0.70 and later.; JavaScript crashes: Uncaught errors and unhandled rejections arrive with the stack and the last 20 steps before them.; Kept offline: With AsyncStorage, lines written offline or just before a crash are sent on the next launch.; Batched and retried: 50 lines or 5 seconds, and when the app goes to the background. Retries honour Retry-After.; A key safe to ship: The app key works only for your app ids and has its own rate limit, so a copy cannot use your quota.; Private by default: Only the user id you set is sent, never a name or an email. The client never throws into your app.">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1"><stop offset="0" stop-color="#FF5F2E" stop-opacity="0.14"/><stop offset="1" stop-color="#FF5F2E" stop-opacity="0"/></radialGradient>
  </defs>
