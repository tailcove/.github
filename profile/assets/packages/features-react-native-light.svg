  <rect x="412.5" y="0.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="412.5" y="0.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="440" y="26" width="44" height="44" rx="11" fill="#C7340F" fill-opacity="0.08" stroke="#C7340F" stroke-opacity="0.28"/><g transform="translate(450 36) scale(1)" fill="none" stroke="#C7340F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><rect x="8" y="8" width="8" height="11" rx="4"/><path d="M12 8V5M9 5.5 10.5 8M15 5.5 13.5 8M4.5 12H8M16 12h3.5M4.5 17H8M16 17h3.5"/></g><text x="500" y="56" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">JavaScript crashes</text><text x="440" y="106" font-size="14.5" fill="#5C5C58">Uncaught errors and unhandled rejections</text><text x="440" y="128" font-size="14.5" fill="#5C5C58">arrive with the stack and the last 20</text><text x="440" y="150" font-size="14.5" fill="#5C5C58">steps before them.</text>
  <rect x="824.5" y="0.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="824.5" y="0.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="852" y="26" width="44" height="44" rx="11" fill="#C7340F" fill-opacity="0.08" stroke="#C7340F" stroke-opacity="0.28"/><g transform="translate(862 36) scale(1)" fill="none" stroke="#C7340F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="912" y="56" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">Kept offline</text><text x="852" y="106" font-size="14.5" fill="#5C5C58">With AsyncStorage, lines written offline</text><text x="852" y="128" font-size="14.5" fill="#5C5C58">or just before a crash are sent on the</text><text x="852" y="150" font-size="14.5" fill="#5C5C58">next launch.</text>
  <rect x="0.5" y="200.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="0.5" y="200.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="28" y="226" width="44" height="44" rx="11" fill="#C7340F" fill-opacity="0.08" stroke="#C7340F" stroke-opacity="0.28"/><g transform="translate(38 236) scale(1)" fill="none" stroke="#C7340F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><path d="M3 12c3-6 6-6 9 0s6 6 9 0"/></g><text x="88" y="256" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">Batched and retried</text><text x="28" y="306" font-size="14.5" fill="#5C5C58">50 lines or 5 seconds, and when the app</text><text x="28" y="328" font-size="14.5" fill="#5C5C58">goes to the background. Retries honour</text><text x="28" y="350" font-size="14.5" fill="#5C5C58">Retry-After.</text>
  <rect x="412.5" y="200.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="412.5" y="200.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="440" y="226" width="44" height="44" rx="11" fill="#C7340F" fill-opacity="0.08" stroke="#C7340F" stroke-opacity="0.28"/><g transform="translate(450 236) scale(1)" fill="none" stroke="#C7340F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><path d="M12 2l8 3v6c0 5.5-3.5 9.5-8 11-4.5-1.5-8-5.5-8-11V5z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></g><text x="500" y="256" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">A key safe to ship</text><text x="440" y="306" font-size="14.5" fill="#5C5C58">The app key works only for your app ids</text><text x="440" y="328" font-size="14.5" fill="#5C5C58">and has its own rate limit, so a copy</text><text x="440" y="350" font-size="14.5" fill="#5C5C58">cannot use your quota.</text>
  <rect x="824.5" y="200.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="824.5" y="200.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="852" y="226" width="44" height="44" rx="11" fill="#C7340F" fill-opacity="0.08" stroke="#C7340F" stroke-opacity="0.28"/><g transform="translate(862 236) scale(1)" fill="none" stroke="#C7340F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></g><text x="912" y="256" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">Private by default</text><text x="852" y="306" font-size="14.5" fill="#5C5C58">Only the user id you set is sent, never a</text><text x="852" y="328" font-size="14.5" fill="#5C5C58">name or an email. The client never throws</text><text x="852" y="350" font-size="14.5" fill="#5C5C58">into your app.</text>
  </g>
