    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="664" y="124" xml:space="preserve"><tspan fill="#4F46E5">import</tspan><tspan fill="#2A2A28"> { init } </tspan><tspan fill="#4F46E5">from</tspan><tspan fill="#0F766E"> &#x27;@tailcove/browser&#x27;</tspan><tspan fill="#2A2A28">;</tspan></text>
      <text x="664" y="174" xml:space="preserve"><tspan fill="#4F46E5">const</tspan><tspan fill="#2A2A28"> log = </tspan><tspan fill="#111111">init</tspan><tspan fill="#2A2A28">({</tspan></text>
      <text x="664" y="199" xml:space="preserve"><tspan fill="#2A2A28">  key: </tspan><tspan fill="#0F766E">&#x27;your-browser-key&#x27;</tspan><tspan fill="#2A2A28">,</tspan></text>
