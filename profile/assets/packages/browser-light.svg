      <text x="664" y="249" xml:space="preserve"><tspan fill="#2A2A28">  captureUnhandledRejections: </tspan><tspan fill="#4F46E5">true</tspan><tspan fill="#2A2A28">,</tspan></text>
      <text x="664" y="274" xml:space="preserve"><tspan fill="#2A2A28">});</tspan></text>
      <text x="664" y="324" xml:space="preserve"><tspan fill="#2A2A28">log.</tspan><tspan fill="#111111">error</tspan><tspan fill="#2A2A28">(</tspan><tspan fill="#0F766E">&#x27;checkout failed&#x27;</tspan><tspan fill="#2A2A28">, { orderId: </tspan><tspan fill="#B45309">99</tspan><tspan fill="#2A2A28"> });</tspan></text>
    </g>
  </g>

