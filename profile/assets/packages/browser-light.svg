<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Tailcove for Browser: Frontend errors, next to your backend">
  <defs>
    <radialGradient id="g1" cx="0.16" cy="0.3" r="0.6"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.22"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.88" cy="0.92" r="0.55"><stop offset="0" stop-color="#6366F1" stop-opacity="0.14"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F766E"/><stop offset="0.5" stop-color="#0F766E" stop-opacity="0.15"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0A0A0A"/><stop offset="1" stop-color="#134E4A"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#000000" stroke-opacity="0.045"/></pattern>
    <clipPath id="hclip"><rect width="1200" height="420" rx="20"/></clipPath>
    <clipPath id="card"><rect x="640" y="52" width="500" height="317" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#hclip)">
  <rect width="1200" height="420" fill="#FAFAF7"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect width="1200" height="420" fill="url(#g1)"/>
  <rect width="1200" height="420" fill="url(#g2)"/>

  <!-- mark + wordmark + package pill -->
  <g transform="translate(72 64)">
    <rect width="44" height="44" rx="10" fill="#A6E3D2"/>
    <g fill="#0A0A0A">
      <rect x="9" y="11" width="26" height="6" rx="1.6"/><rect x="19" y="17" width="6" height="19" rx="1.6"/>
      <rect x="9" y="27" width="6" height="9" rx="1.6"/><rect x="29" y="27" width="6" height="9" rx="1.6"/>
    </g>
    <text x="58" y="33" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-1" fill="url(#word)">tailcove</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500">
    <rect x="252" y="73" width="154" height="26" rx="13" fill="#0F766E" fill-opacity="0.08" stroke="#0F766E" stroke-opacity="0.40"/>
    <text x="329" y="90.5" text-anchor="middle" fill="#0F766E">@tailcove/browser</text>
  </g>

  <!-- headline -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="198" font-size="48" font-weight="700" letter-spacing="-1.4" fill="#0A0A0A">Frontend errors,</text>
    <text x="72" y="254" font-size="48" font-weight="700" letter-spacing="-1.4" fill="url(#word)">next to your backend</text>
    <text x="72" y="294" font-size="16" fill="#5C5C58">Reliable on page close · opt-in auto-capture · tiny.</text>
  </g>

  <!-- install command -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500">
    <rect x="72" y="326" width="323" height="40" rx="10" fill="#0A0A0A" fill-opacity="0.04" stroke="#0A0A0A" stroke-opacity="0.16"/>
    <text x="92" y="351" fill="#0F766E">$</text>
    <text x="110" y="351" fill="#1F1F1D">npm install @tailcove/browser</text>
  </g>

  <!-- code card -->
  <rect x="639" y="51" width="502" height="319" rx="15" fill="url(#ring)"/>
  <rect x="640" y="52" width="500" height="317" rx="14" fill="#FFFFFF"/>
  <g clip-path="url(#card)">
    <rect x="640" y="52" width="500" height="38" fill="#000000" fill-opacity="0.03"/>
    <line x1="640" y1="90.5" x2="1140" y2="90.5" stroke="#000000" stroke-opacity="0.08"/>
    <circle cx="662" cy="71" r="5" fill="#FF5F57"/><circle cx="680" cy="71" r="5" fill="#FEBC2E"/><circle cx="698" cy="71" r="5" fill="#28C840"/>
    <text x="890" y="76" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A8A85">main.ts</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="664" y="124" xml:space="preserve"><tspan fill="#4F46E5">import</tspan><tspan fill="#2A2A28"> { init } </tspan><tspan fill="#4F46E5">from</tspan><tspan fill="#0F766E"> &#x27;@tailcove/browser&#x27;</tspan><tspan fill="#2A2A28">;</tspan></text>
      <text x="664" y="174" xml:space="preserve"><tspan fill="#4F46E5">const</tspan><tspan fill="#2A2A28"> log = </tspan><tspan fill="#111111">init</tspan><tspan fill="#2A2A28">({</tspan></text>
      <text x="664" y="199" xml:space="preserve"><tspan fill="#2A2A28">  key: </tspan><tspan fill="#0F766E">&#x27;your-browser-key&#x27;</tspan><tspan fill="#2A2A28">,</tspan></text>
      <text x="664" y="224" xml:space="preserve"><tspan fill="#2A2A28">  captureWindowErrors: </tspan><tspan fill="#4F46E5">true</tspan><tspan fill="#2A2A28">,</tspan></text>
      <text x="664" y="249" xml:space="preserve"><tspan fill="#2A2A28">  captureUnhandledRejections: </tspan><tspan fill="#4F46E5">true</tspan><tspan fill="#2A2A28">,</tspan></text>
      <text x="664" y="274" xml:space="preserve"><tspan fill="#2A2A28">});</tspan></text>
      <text x="664" y="324" xml:space="preserve"><tspan fill="#2A2A28">log.</tspan><tspan fill="#111111">error</tspan><tspan fill="#2A2A28">(</tspan><tspan fill="#0F766E">&#x27;checkout failed&#x27;</tspan><tspan fill="#2A2A28">, { orderId: </tspan><tspan fill="#B45309">99</tspan><tspan fill="#2A2A28"> });</tspan></text>
    </g>
  </g>

  <text x="1140" y="397" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6B66">React · Vue · Svelte · Next.js · plain &lt;script&gt; tag</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="19.5" fill="none" stroke="#000000" stroke-opacity="0.12"/>
</svg>
