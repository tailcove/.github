    <rect x="953.1" y="452" width="1" height="52" fill="#000000" fill-opacity="0.09"/>
    <g transform="translate(981.0727859447832 449) scale(0.5416666666666666)" fill="none" stroke="#C7340F" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 7h14"/><path d="M5 7 2 14a3.5 3.5 0 0 0 6 0zM19 7l-3 7a3.5 3.5 0 0 0 6 0z"/></g>
