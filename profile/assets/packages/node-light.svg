    <g transform="translate(520.1534600215132 449) scale(0.5416666666666666)" fill="none" stroke="#C7340F" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l2 12H4z"/><circle cx="12" cy="5" r="2"/></g>
    <text x="540.2" y="460" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="650" letter-spacing="1.2" fill="#6F6F6A">SIZE</text>
    <text x="520.2" y="492" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="-0.8" fill="#0A0A0A">1.8<tspan font-size="14" font-weight="600" fill="#6F6F6A" dx="3">kB</tspan></text>
    <text x="520.2" y="511" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8A8A85">gzipped, core client</text>
