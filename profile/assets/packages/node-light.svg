    <text x="365.2" y="460" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="650" letter-spacing="1.2" fill="#6F6F6A">NODE.JS</text>
    <text x="345.2" y="492" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="-0.8" fill="#0A0A0A">18<tspan font-size="14" font-weight="600" fill="#6F6F6A" dx="3">+</tspan></text>
