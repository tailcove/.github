    <circle cx="789.0" cy="384" r="16.5" fill="#000000" fill-opacity="0.04" stroke="#000000" stroke-opacity="0.16"/>
    <g transform="translate(781.0 376) scale(0.6666666666666666)" fill="none" stroke="#0A0A0A" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="8" height="11" rx="4"/><path d="M12 8V5M9 5.5 10.5 8M15 5.5 13.5 8M4.5 12H8M16 12h3.5M4.5 17H8M16 17h3.5"/></g>
    <text x="1140" y="381" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6B66">Pino · Winston · ESM + CJS</text><text x="1140" y="397" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6B66">TypeScript types included</text>
  </g>

