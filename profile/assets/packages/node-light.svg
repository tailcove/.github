<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="556" viewBox="0 0 1200 556" role="img" aria-label="Tailcove for Node.js: Node.js logs, in two lines">
  <defs>
    <radialGradient id="g1" cx="0.16" cy="0.3" r="0.6"><stop offset="0" stop-color="#FF5F2E" stop-opacity="0.22"/><stop offset="1" stop-color="#FF5F2E" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.88" cy="0.92" r="0.55"><stop offset="0" stop-color="#6D6AFF" stop-opacity="0.14"/><stop offset="1" stop-color="#6D6AFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C7340F"/><stop offset="0.5" stop-color="#C7340F" stop-opacity="0.15"/><stop offset="1" stop-color="#6D6AFF"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0A0A0A"/><stop offset="1" stop-color="#7A1F08"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#000000" stroke-opacity="0.045"/></pattern>
    <clipPath id="hclip"><rect width="1200" height="556" rx="20"/></clipPath>
    <clipPath id="card"><rect x="640" y="64" width="500" height="292" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#hclip)">
  <rect width="1200" height="556" fill="#FAFAF7"/>
  <rect width="1200" height="556" fill="url(#grid)"/>
  <rect width="1200" height="556" fill="url(#g1)"/>
  <rect width="1200" height="556" fill="url(#g2)"/>

  <!-- mark + wordmark + package pill -->
  <g transform="translate(72 64)">
    <linearGradient id="tcTile1" x1="0" y1="0" x2="44.0" y2="44.0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF8A5C"/><stop offset="0.55" stop-color="#FF5F2E"/><stop offset="1" stop-color="#D63A12"/></linearGradient><rect width="44.0" height="44.0" rx="11" fill="url(#tcTile1)"/><g transform="scale(1.375) translate(6 6) scale(0.8333)" fill="#FFFFFF"><rect x="3.5" y="5" width="11" height="4" rx="2"/><rect x="16.5" y="5" width="4" height="4" rx="1.2"/><path d="M7 7v8c0 2.2 1.8 4 4 4h4.5a2 2 0 0 0 0-4h-3.9a.6.6 0 0 1-.6-.6V7Z"/></g>
    <text x="58" y="33" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-1" fill="url(#word)">tailcove</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500">
    <rect x="252" y="73" width="132" height="26" rx="13" fill="#C7340F" fill-opacity="0.08" stroke="#C7340F" stroke-opacity="0.40"/>
    <text x="318" y="90.5" text-anchor="middle" fill="#C7340F">@tailcove/node</text>
  </g>

  <!-- headline -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="198" font-size="48" font-weight="700" letter-spacing="-1.4" fill="#0A0A0A">Node.js logs,</text>
    <text x="72" y="254" font-size="48" font-weight="700" letter-spacing="-1.4" fill="url(#word)">in two lines</text>
    <text x="72" y="294" font-size="16" fill="#5C5C58">Batched · non-blocking · never throws into your app.</text>
  </g>

  <!-- install command -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500">
    <rect x="72" y="326" width="296" height="40" rx="10" fill="#0A0A0A" fill-opacity="0.04" stroke="#0A0A0A" stroke-opacity="0.16"/>
    <text x="92" y="351" fill="#C7340F">$</text>
    <text x="110" y="351" fill="#1F1F1D">npm install @tailcove/node</text>
  </g>

  <!-- code card -->
  <rect x="639" y="63" width="502" height="294" rx="15" fill="url(#ring)"/>
  <rect x="640" y="64" width="500" height="292" rx="14" fill="#FFFFFF"/>
  <g clip-path="url(#card)">
    <rect x="640" y="64" width="500" height="38" fill="#000000" fill-opacity="0.03"/>
    <line x1="640" y1="102.5" x2="1140" y2="102.5" stroke="#000000" stroke-opacity="0.08"/>
    <circle cx="662" cy="83" r="5" fill="#FF5F57"/><circle cx="680" cy="83" r="5" fill="#FEBC2E"/><circle cx="698" cy="83" r="5" fill="#28C840"/>
    <text x="890" y="88" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A8A85">log.ts</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="664" y="136" xml:space="preserve"><tspan fill="#5450E6">import</tspan><tspan fill="#2A2A28"> { Tailcove } </tspan><tspan fill="#5450E6">from</tspan><tspan fill="#C7340F"> &#x27;@tailcove/node&#x27;</tspan><tspan fill="#2A2A28">;</tspan></text>
      <text x="664" y="186" xml:space="preserve"><tspan fill="#5450E6">const</tspan><tspan fill="#2A2A28"> log = </tspan><tspan fill="#5450E6">new</tspan><tspan fill="#2A2A28"> </tspan><tspan fill="#111111">Tailcove</tspan><tspan fill="#2A2A28">({</tspan></text>
      <text x="664" y="211" xml:space="preserve"><tspan fill="#2A2A28">  token: process.env.</tspan><tspan fill="#3F3F3C">TAILCOVE_TOKEN</tspan><tspan fill="#2A2A28">,</tspan></text>
      <text x="664" y="236" xml:space="preserve"><tspan fill="#2A2A28">});</tspan></text>
      <text x="664" y="286" xml:space="preserve"><tspan fill="#2A2A28">log.</tspan><tspan fill="#111111">info</tspan><tspan fill="#2A2A28">(</tspan><tspan fill="#C7340F">&#x27;user signed up&#x27;</tspan><tspan fill="#2A2A28">, { userId: </tspan><tspan fill="#B45309">42</tspan><tspan fill="#2A2A28"> });</tspan></text>
      <text x="664" y="311" xml:space="preserve"><tspan fill="#2A2A28">log.</tspan><tspan fill="#111111">error</tspan><tspan fill="#2A2A28">(</tspan><tspan fill="#C7340F">&#x27;payment failed&#x27;</tspan><tspan fill="#2A2A28">, { orderId: </tspan><tspan fill="#B45309">99</tspan><tspan fill="#2A2A28"> });</tspan></text>
    </g>
  </g>

  <!-- round icon buttons (left) and footnote (right) under the card -->
  <g>
    <circle cx="657.0" cy="384" r="16.5" fill="#000000" fill-opacity="0.04" stroke="#000000" stroke-opacity="0.16"/>
    <g transform="translate(649.0 376) scale(0.6666666666666666)" fill="none" stroke="#0A0A0A" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5V5.5M8 7h7"/></g>
    <defs><linearGradient id="rb1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C7340F"/><stop offset="1" stop-color="#F0461A"/></linearGradient></defs><circle cx="701.0" cy="384" r="17.0" fill="url(#rb1)"/>
