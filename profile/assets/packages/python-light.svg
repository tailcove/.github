    <text x="890" y="76" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A8A85">app.py</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="664" y="124" xml:space="preserve"><tspan fill="#4F46E5">import</tspan><tspan fill="#2A2A28"> logging</tspan></text>
      <text x="664" y="149" xml:space="preserve"><tspan fill="#4F46E5">from</tspan><tspan fill="#2A2A28"> tailcove </tspan><tspan fill="#4F46E5">import</tspan><tspan fill="#111111"> TailcoveHandler</tspan></text>
      <text x="664" y="199" xml:space="preserve"><tspan fill="#2A2A28">log = logging.</tspan><tspan fill="#111111">getLogger</tspan><tspan fill="#2A2A28">(</tspan><tspan fill="#0F766E">&quot;myapp&quot;</tspan><tspan fill="#2A2A28">)</tspan></text>
      <text x="664" y="224" xml:space="preserve"><tspan fill="#2A2A28">log.</tspan><tspan fill="#111111">addHandler</tspan><tspan fill="#2A2A28">(</tspan><tspan fill="#111111">TailcoveHandler</tspan><tspan fill="#2A2A28">(token=TOKEN))</tspan></text>
      <text x="664" y="274" xml:space="preserve"><tspan fill="#2A2A28">log.</tspan><tspan fill="#111111">info</tspan><tspan fill="#2A2A28">(</tspan><tspan fill="#0F766E">&quot;user signed up&quot;</tspan><tspan fill="#2A2A28">,</tspan></text>
      <text x="664" y="299" xml:space="preserve"><tspan fill="#2A2A28">         extra={</tspan><tspan fill="#0F766E">&quot;user_id&quot;</tspan><tspan fill="#2A2A28">: </tspan><tspan fill="#B45309">42</tspan><tspan fill="#2A2A28">})</tspan></text>
      <text x="664" y="324" xml:space="preserve"><tspan fill="#2A2A28">log.</tspan><tspan fill="#111111">error</tspan><tspan fill="#2A2A28">(</tspan><tspan fill="#0F766E">&quot;payment failed&quot;</tspan><tspan fill="#2A2A28">, exc_info=</tspan><tspan fill="#4F46E5">True</tspan><tspan fill="#2A2A28">)</tspan></text>
    </g>
  </g>

