    <text x="58" y="33" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-1" fill="url(#word)">tailcove</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500">
    <rect x="252" y="73" width="88" height="26" rx="13" fill="#0F766E" fill-opacity="0.08" stroke="#0F766E" stroke-opacity="0.40"/>
    <text x="296" y="90.5" text-anchor="middle" fill="#0F766E">tailcove</text>
  </g>

  <!-- headline -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="198" font-size="48" font-weight="700" letter-spacing="-1.4" fill="#0A0A0A">Python logs,</text>
    <text x="72" y="254" font-size="48" font-weight="700" letter-spacing="-1.4" fill="url(#word)">with plain logging</text>
    <text x="72" y="294" font-size="16" fill="#5C5C58">Standard library only · background thread · never raises.</text>
  </g>

  <!-- install command -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500">
    <rect x="72" y="326" width="242" height="40" rx="10" fill="#0A0A0A" fill-opacity="0.04" stroke="#0A0A0A" stroke-opacity="0.16"/>
    <text x="92" y="351" fill="#0F766E">$</text>
    <text x="110" y="351" fill="#1F1F1D">pip install tailcove</text>
  </g>

  <!-- code card -->
  <rect x="639" y="51" width="502" height="319" rx="15" fill="url(#ring)"/>
  <rect x="640" y="52" width="500" height="317" rx="14" fill="#FFFFFF"/>
