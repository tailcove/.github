<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Tailcove for Node.js: Node.js logs, in two lines">
  <defs>
    <radialGradient id="g1" cx="0.16" cy="0.3" r="0.6"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.30"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.88" cy="0.92" r="0.55"><stop offset="0" stop-color="#6366F1" stop-opacity="0.26"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="0.5" stop-color="#5EEAD4" stop-opacity="0.15"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C7FFF3"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
    <clipPath id="card"><rect x="640" y="64" width="500" height="292" rx="14"/></clipPath>
  </defs>

  <rect width="1200" height="420" fill="#0A0A0A"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect width="1200" height="420" fill="url(#g1)"/>
  <rect width="1200" height="420" fill="url(#g2)"/>

  <!-- mark + wordmark + package pill -->
  <g transform="translate(72 64)">
    <rect width="44" height="44" rx="10" fill="#A6E3D2"/>
    <g fill="#0A0A0A">
      <rect x="9" y="11" width="26" height="6" rx="1.6"/><rect x="19" y="17" width="6" height="19" rx="1.6"/>
      <rect x="9" y="27" width="6" height="9" rx="1.6"/><rect x="29" y="27" width="6" height="9" rx="1.6"/>
    </g>
    <text x="58" y="33" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-1" fill="url(#word)">tailcove</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500">
    <rect x="252" y="73" width="132" height="26" rx="13" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-opacity="0.45"/>
    <text x="318" y="90.5" text-anchor="middle" fill="#5EEAD4">@tailcove/node</text>
  </g>

  <!-- headline -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="198" font-size="48" font-weight="700" letter-spacing="-1.4" fill="#EDEDEC">Node.js logs,</text>
    <text x="72" y="254" font-size="48" font-weight="700" letter-spacing="-1.4" fill="url(#word)">in two lines</text>
    <text x="72" y="294" font-size="16" fill="#9A9A96">Batched · non-blocking · never throws into your app.</text>
  </g>

  <!-- install command -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500">
    <rect x="72" y="326" width="296" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="92" y="351" fill="#5EEAD4">$</text>
    <text x="110" y="351" fill="#E6E6E2">npm install @tailcove/node</text>
  </g>

  <!-- code card -->
  <rect x="639" y="63" width="502" height="294" rx="15" fill="url(#ring)"/>
  <rect x="640" y="64" width="500" height="292" rx="14" fill="#0F1413"/>
  <g clip-path="url(#card)">
    <rect x="640" y="64" width="500" height="38" fill="#FFFFFF" fill-opacity="0.03"/>
    <line x1="640" y1="102.5" x2="1140" y2="102.5" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <circle cx="662" cy="83" r="5" fill="#FF5F57"/><circle cx="680" cy="83" r="5" fill="#FEBC2E"/><circle cx="698" cy="83" r="5" fill="#28C840"/>
    <text x="890" y="88" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7C8785">log.ts</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="664" y="136" xml:space="preserve"><tspan fill="#A5B4FC">import</tspan><tspan fill="#D4D4D0"> { Tailcove } </tspan><tspan fill="#A5B4FC">from</tspan><tspan fill="#5EEAD4"> &#x27;@tailcove/node&#x27;</tspan><tspan fill="#D4D4D0">;</tspan></text>
      <text x="664" y="186" xml:space="preserve"><tspan fill="#A5B4FC">const</tspan><tspan fill="#D4D4D0"> log = </tspan><tspan fill="#A5B4FC">new</tspan><tspan fill="#D4D4D0"> </tspan><tspan fill="#E5E7EB">Tailcove</tspan><tspan fill="#D4D4D0">({</tspan></text>
      <text x="664" y="211" xml:space="preserve"><tspan fill="#D4D4D0">  token: process.env.</tspan><tspan fill="#C9D1CE">TAILCOVE_TOKEN</tspan><tspan fill="#D4D4D0">,</tspan></text>
      <text x="664" y="236" xml:space="preserve"><tspan fill="#D4D4D0">});</tspan></text>
      <text x="664" y="286" xml:space="preserve"><tspan fill="#D4D4D0">log.</tspan><tspan fill="#E5E7EB">info</tspan><tspan fill="#D4D4D0">(</tspan><tspan fill="#5EEAD4">&#x27;user signed up&#x27;</tspan><tspan fill="#D4D4D0">, { userId: </tspan><tspan fill="#FBBF24">42</tspan><tspan fill="#D4D4D0"> });</tspan></text>
      <text x="664" y="311" xml:space="preserve"><tspan fill="#D4D4D0">log.</tspan><tspan fill="#E5E7EB">error</tspan><tspan fill="#D4D4D0">(</tspan><tspan fill="#5EEAD4">&#x27;payment failed&#x27;</tspan><tspan fill="#D4D4D0">, { orderId: </tspan><tspan fill="#FBBF24">99</tspan><tspan fill="#D4D4D0"> });</tspan></text>
    </g>
  </g>

  <text x="1140" y="396" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7C8785">Pino · Winston · ESM + CJS · TypeScript types included</text>
</svg>
