    <rect x="0.5" y="0.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="0.5" y="0.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="28" y="26" width="44" height="44" rx="11" fill="#C7340F" fill-opacity="0.08" stroke="#C7340F" stroke-opacity="0.28"/><g transform="translate(38 36) scale(1)" fill="none" stroke="#C7340F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><path d="m12 2 10 6-10 6L2 8z"/><path d="m2 12 10 6 10-6"/></g><text x="88" y="56" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">Three resources</text><text x="28" y="106" font-size="14.5" fill="#5C5C58">Sources, uptime monitors and alerts, with</text><text x="28" y="128" font-size="14.5" fill="#5C5C58">data sources for escalation policies and</text><text x="28" y="150" font-size="14.5" fill="#5C5C58">on-call schedules.</text>
  <rect x="412.5" y="0.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="412.5" y="0.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="440" y="26" width="44" height="44" rx="11" fill="#C7340F" fill-opacity="0.08" stroke="#C7340F" stroke-opacity="0.28"/><g transform="translate(450 36) scale(1)" fill="none" stroke="#C7340F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><path d="M12 2l8 3v6c0 5.5-3.5 9.5-8 11-4.5-1.5-8-5.5-8-11V5z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></g><text x="500" y="56" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">Secrets stay secret</text><text x="440" y="106" font-size="14.5" fill="#5C5C58">Channel keys and header values are write-</text><text x="440" y="128" font-size="14.5" fill="#5C5C58">only and sensitive. The ingest token is</text><text x="440" y="150" font-size="14.5" fill="#5C5C58">kept in state, marked sensitive.</text>
  <rect x="824.5" y="0.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="824.5" y="0.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="852" y="26" width="44" height="44" rx="11" fill="#C7340F" fill-opacity="0.08" stroke="#C7340F" stroke-opacity="0.28"/><g transform="translate(862 36) scale(1)" fill="none" stroke="#C7340F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></g><text x="912" y="56" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">Only what you set</text><text x="852" y="106" font-size="14.5" fill="#5C5C58">Defaults the API fills in never show up as</text><text x="852" y="128" font-size="14.5" fill="#5C5C58">a change. Set a field to have Terraform</text><text x="852" y="150" font-size="14.5" fill="#5C5C58">manage it.</text>
  <rect x="0.5" y="200.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="0.5" y="200.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="28" y="226" width="44" height="44" rx="11" fill="#C7340F" fill-opacity="0.08" stroke="#C7340F" stroke-opacity="0.28"/><g transform="translate(38 236) scale(1)" fill="none" stroke="#C7340F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><path d="M3 12c3-6 6-6 9 0s6 6 9 0"/></g><text x="88" y="256" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">Safe to retry</text><text x="28" y="306" font-size="14.5" fill="#5C5C58">Throttled writes wait and retry, and every</text><text x="28" y="328" font-size="14.5" fill="#5C5C58">create carries an Idempotency-Key, so</text><text x="28" y="350" font-size="14.5" fill="#5C5C58">nothing is made twice.</text>
  <rect x="412.5" y="200.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="412.5" y="200.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="440" y="226" width="44" height="44" rx="11" fill="#C7340F" fill-opacity="0.08" stroke="#C7340F" stroke-opacity="0.28"/><g transform="translate(450 236) scale(1)" fill="none" stroke="#C7340F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></g><text x="500" y="256" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">Import what exists</text><text x="440" y="306" font-size="14.5" fill="#5C5C58">Bring a source, a monitor or an alert under</text><text x="440" y="328" font-size="14.5" fill="#5C5C58">Terraform without recreating it.</text>
  <rect x="824.5" y="200.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="824.5" y="200.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="852" y="226" width="44" height="44" rx="11" fill="#C7340F" fill-opacity="0.08" stroke="#C7340F" stroke-opacity="0.28"/><g transform="translate(862 236) scale(1)" fill="none" stroke="#C7340F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-8M17 7l2 2"/></g><text x="912" y="256" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">Scoped token</text><text x="852" y="306" font-size="14.5" fill="#5C5C58">One API token, with only the abilities the</text><text x="852" y="328" font-size="14.5" fill="#5C5C58">configuration needs. One team per provider.</text>
  </g>
</svg>
