<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="376" viewBox="0 0 1200 376" role="img" aria-label="Three resources: Sources, uptime monitors and alerts, with data sources for escalation policies and on-call schedules.; Secrets stay secret: Channel keys and header values are write-only and sensitive. The ingest token is kept in state, marked sensitive.; Only what you set: Defaults the API fills in never show up as a change. Set a field to have Terraform manage it.; Safe to retry: Throttled writes wait and retry, and every create carries an Idempotency-Key, so nothing is made twice.; Import what exists: Bring a source, a monitor or an alert under Terraform without recreating it.; Scoped token: One API token, with only the abilities the configuration needs. One team per provider.">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1"><stop offset="0" stop-color="#FF5F2E" stop-opacity="0.14"/><stop offset="1" stop-color="#FF5F2E" stop-opacity="0"/></radialGradient>
  </defs>
