  <rect x="824.5" y="200.5" width="375" height="175" rx="16" fill="#10121B" stroke="#FFFFFF" stroke-opacity="0.09"/><rect x="824.5" y="200.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="852" y="226" width="44" height="44" rx="11" fill="#FF5F2E" fill-opacity="0.12" stroke="#FF5F2E" stroke-opacity="0.30"/><g transform="translate(862 236) scale(1)" fill="none" stroke="#FFB199" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><path d="m12 2 10 6-10 6L2 8z"/><path d="m2 12 10 6 10-6"/></g><text x="912" y="256" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#F4F5F8">Routes as breadcrumbs</text><text x="852" y="306" font-size="14.5" fill="#9399A8">TailcoveNavigatorObserver adds each route</text><text x="852" y="328" font-size="14.5" fill="#9399A8">change to the trail sent with an error.</text>
