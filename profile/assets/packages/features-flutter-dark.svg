<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="376" viewBox="0 0 1200 376" role="img" aria-label="One wrapper: Tailcove.runApp sets up Flutter, starts the client and hooks the error handlers before your app runs.; Flutter and Dart errors: Build, layout and paint failures and uncaught Dart errors, with the stack and the last 20 steps.; Kept across restarts: Unsent lines are saved to a file in the app&#x27;s support directory and sent on the next launch.; Batched and retried: 50 lines or 5 seconds, and when the app goes to the background. Retries honour Retry-After.; A key safe to ship: The app key works only for your app ids and has its own rate limit, so a copy cannot use your quota.; Routes as breadcrumbs: TailcoveNavigatorObserver adds each route change to the trail sent with an error.">
