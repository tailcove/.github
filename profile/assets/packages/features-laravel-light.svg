  <rect x="412.5" y="0.5" width="375" height="175" rx="16" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.10"/><rect x="412.5" y="0.5" width="375" height="175" rx="16" fill="url(#glow)"/><rect x="440" y="26" width="44" height="44" rx="11" fill="#0F766E" fill-opacity="0.08" stroke="#0F766E" stroke-opacity="0.28"/><g transform="translate(450 36) scale(1)" fill="none" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform-origin="0 0"><path d="M12 2l8 3v6c0 5.5-3.5 9.5-8 11-4.5-1.5-8-5.5-8-11V5z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></g><text x="500" y="56" font-size="19" font-weight="650" letter-spacing="-0.3" fill="#0A0A0A">Safe</text><text x="440" y="106" font-size="14.5" fill="#5C5C58">A failed delivery is caught and written to</text><text x="440" y="128" font-size="14.5" fill="#5C5C58">error_log(). It never fails a request.</text>
