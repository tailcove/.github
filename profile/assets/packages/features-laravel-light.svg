<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="376" viewBox="0 0 1200 376" role="img" aria-label="No added latency: Logs are sent from a shutdown function, after the response has already gone out.; Safe: A failed delivery is caught and written to error_log(). It never fails a request.; Context for free: Environment, hostname, signed-in user and a request ID on every line.; Exceptions as data: report($e) arrives with class, message, location and trace.; Optional extras: Slow queries, failed jobs and scheduler failures, one setting each.; Queue mode: Prefer the worker? Switch to a queued job with retries.">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.14"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
  </defs>
