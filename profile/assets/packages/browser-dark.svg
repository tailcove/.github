      <text x="664" y="274" xml:space="preserve"><tspan fill="#C9CCD6">});</tspan></text>
      <text x="664" y="324" xml:space="preserve"><tspan fill="#C9CCD6">log.</tspan><tspan fill="#E4E6EE">error</tspan><tspan fill="#C9CCD6">(</tspan><tspan fill="#FFB199">&#x27;checkout failed&#x27;</tspan><tspan fill="#C9CCD6">, { orderId: </tspan><tspan fill="#FBBF24">99</tspan><tspan fill="#C9CCD6"> });</tspan></text>
    </g>
  </g>

