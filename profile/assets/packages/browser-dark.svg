    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="664" y="124" xml:space="preserve"><tspan fill="#B4B5FF">import</tspan><tspan fill="#C9CCD6"> { init } </tspan><tspan fill="#B4B5FF">from</tspan><tspan fill="#FFB199"> &#x27;@tailcove/browser&#x27;</tspan><tspan fill="#C9CCD6">;</tspan></text>
      <text x="664" y="174" xml:space="preserve"><tspan fill="#B4B5FF">const</tspan><tspan fill="#C9CCD6"> log = </tspan><tspan fill="#E4E6EE">init</tspan><tspan fill="#C9CCD6">({</tspan></text>
      <text x="664" y="199" xml:space="preserve"><tspan fill="#C9CCD6">  key: </tspan><tspan fill="#FFB199">&#x27;your-browser-key&#x27;</tspan><tspan fill="#C9CCD6">,</tspan></text>
