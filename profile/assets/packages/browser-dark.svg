    <radialGradient id="g2" cx="0.88" cy="0.92" r="0.55"><stop offset="0" stop-color="#6D6AFF" stop-opacity="0.26"/><stop offset="1" stop-color="#6D6AFF" stop-opacity="0"/></radialGradient>
