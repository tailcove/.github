<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="376" viewBox="0 0 1200 376" role="img" aria-label="Fast: Lines are batched, 50 at a time or every 2 seconds. Your code never waits on the network.; Safe: A failed delivery is caught and dropped. Logging will never be the reason your app crashes.; Lightweight: Delivery uses the built-in fetch. Only two tiny helpers for the transports.; Pino and Winston: Drop in as a transport and keep the logger you already use.; Context for free: Hostname, process ID and environment are added to every line automatically.; Typed: Written in TypeScript, with ESM and CommonJS builds.">
