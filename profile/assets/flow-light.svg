<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="How Tailcove works: your apps send logs, Tailcove buffers and stores them, and you get search, issues, alerts and uptime">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C7340F"/><stop offset="0.5" stop-color="#C7340F" stop-opacity="0.15"/><stop offset="1" stop-color="#6D6AFF"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0461A" stop-opacity="0.2"/><stop offset="1" stop-color="#F0461A"/>
    </linearGradient>
    <linearGradient id="wire2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D6AFF"/><stop offset="1" stop-color="#6D6AFF" stop-opacity="0.2"/>
    </linearGradient>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3"><circle cx="3" cy="3" r="2.5" fill="#F0461A"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="199" rx="16" fill="#FAFAF7" stroke="#000000" stroke-opacity="0.10"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <!-- Sources -->
    <text x="60" y="48" font-size="11" font-weight="600" letter-spacing="1.2" fill="#6B6B66">YOUR APPS</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#2A2A28">
      <rect x="60" y="62" width="200" height="26" rx="6" fill="#000000" fill-opacity="0.04" stroke="#000000" stroke-opacity="0.14"/><text x="72" y="79" textLength="160" lengthAdjust="spacingAndGlyphs">Laravel · Node · Python</text>
      <rect x="60" y="94" width="200" height="26" rx="6" fill="#000000" fill-opacity="0.04" stroke="#000000" stroke-opacity="0.14"/><text x="72" y="111">Browser / JS</text>
      <rect x="60" y="126" width="200" height="26" rx="6" fill="#000000" fill-opacity="0.04" stroke="#000000" stroke-opacity="0.14"/><text x="72" y="143" textLength="178" lengthAdjust="spacingAndGlyphs">Vector · Fluent Bit · syslog</text>
    </g>

    <!-- wires in -->
    <path d="M260 75 C330 75 330 100 400 100" fill="none" stroke="url(#wire)" stroke-width="1.5"/>
    <path d="M260 107 C330 107 330 100 400 100" fill="none" stroke="url(#wire)" stroke-width="1.5"/>
    <path d="M260 139 C330 139 330 100 400 100" fill="none" stroke="url(#wire)" stroke-width="1.5"/>
    <text x="330" y="66" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#C7340F" textLength="104" lengthAdjust="spacingAndGlyphs">POST /api/v1/logs</text>

    <!-- Core -->
    <rect x="399" y="39" width="402" height="122" rx="13" fill="url(#ring)"/>
    <rect x="400" y="40" width="400" height="120" rx="12" fill="#FFFFFF"/>
    <g transform="translate(420 60)"><linearGradient id="tcTile" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF8A5C"/><stop offset="0.55" stop-color="#F0461A"/><stop offset="1" stop-color="#D63A12"/></linearGradient><rect width="48" height="48" rx="12" fill="url(#tcTile)"/><g transform="scale(1.5) translate(6 6) scale(0.8333)" fill="#FFFFFE"><rect x="3.5" y="5" width="11" height="4" rx="2"/><rect x="16.5" y="5" width="4" height="4" rx="1.2"/><path d="M7 7v8c0 2.2 1.8 4 4 4h4.5a2 2 0 0 0 0-4h-3.9a.6.6 0 0 1-.6-.6V7Z"/></g></g>
    <text x="484" y="80" font-size="18" font-weight="700" letter-spacing="-0.4" fill="#0A0A0A">Tailcove</text>
    <text x="484" y="100" font-size="12.5" fill="#5C5C58" textLength="166" lengthAdjust="spacingAndGlyphs">Never slows down your app</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6B6B66">
      <text x="420" y="138" textLength="360" lengthAdjust="spacingAndGlyphs">never drops a line · backend + frontend errors in one issue</text>
    </g>

    <!-- wires out -->
    <path d="M800 100 C870 100 870 62 940 62" fill="none" stroke="url(#wire2)" stroke-width="1.5"/>
    <path d="M800 100 C870 100 870 90 940 90" fill="none" stroke="url(#wire2)" stroke-width="1.5"/>
    <path d="M800 100 C870 100 870 118 940 118" fill="none" stroke="url(#wire2)" stroke-width="1.5"/>
    <path d="M800 100 C870 100 870 146 940 146" fill="none" stroke="url(#wire2)" stroke-width="1.5"/>

    <!-- Outputs -->
    <text x="940" y="48" font-size="11" font-weight="600" letter-spacing="1.2" fill="#6B6B66">YOU GET</text>
    <g font-size="13" fill="#0A0A0A">
      <circle cx="946" cy="62" r="3" fill="#C7340F"/><text x="958" y="66" textLength="118" lengthAdjust="spacingAndGlyphs">Search &amp; live tail</text>
      <circle cx="946" cy="90" r="3" fill="#E11D48"/><text x="958" y="94" textLength="176" lengthAdjust="spacingAndGlyphs">Issues (grouped exceptions)</text>
      <circle cx="946" cy="118" r="3" fill="#D97706"/><text x="958" y="122" textLength="182" lengthAdjust="spacingAndGlyphs">Alerts → email, Slack, webhook</text>
      <circle cx="946" cy="146" r="3" fill="#6D6AFF"/><text x="958" y="150" textLength="182" lengthAdjust="spacingAndGlyphs">Uptime monitors &amp; status pages</text>
    </g>
  </g>
</svg>
